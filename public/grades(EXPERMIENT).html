<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor's Grades</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script> <!-- Include PDF.js -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background: linear-gradient(to right, #eef2f3, #ffffff);
            overflow-x: hidden;
        }

        .sidebar {
            width: 80px;
            height: 100vh;
            background: #0c214b;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            transition: width 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            box-shadow: 3px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .sidebar:hover {
            width: 240px;
        }

        .sidebar-header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
        }

        .sidebar-header img {
            width: 50px;
            transition: transform 0.3s ease;
        }

        .sidebar:hover .sidebar-header img {
            transform: scale(1.1);
        }

        .menu {
            list-style: none;
            width: 100%;
            padding: 0;
            margin-top: 20px;
        }

        .menu li a {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            border-radius: 10px;
            margin: 8px 10px;
            white-space: nowrap;
        }

        .menu li a i {
            font-size: 20px;
            width: 40px;
            text-align: center;
        }

        .menu li a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .menu-text {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .sidebar:hover .menu-text {
            opacity: 1;
            margin-left: 5px;
        }

        .main-content {
            flex: 1;
            margin-left: 80px;
            padding: 30px;
            transition: margin-left 0.3s ease-in-out;
            width: 100%;
        }

        .sidebar:hover + .main-content {
            margin-left: 240px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* Batch Selector */
        .batch-selector {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .batch-selector select {
            padding: 10px;
            font-size: 16px;
            margin-left: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Upload Form */
        .upload-form {
            margin-top: 20px;
        }

        .upload-form input[type="file"] {
            padding: 10px;
            font-size: 16px;
            margin-right: 10px;
        }

        .upload-form button {
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .upload-form button:hover {
            background-color: #34495E;
        }

        /* Grades Table */
        .grades-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        .grades-table th,
        .grades-table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        .grades-table th {
            background-color: #f4f4f4;
            font-weight: bold;
        }

    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-header">
        <img src="./assets/samslogopng.png" alt="Logo">
    </div>
    <ul class="menu">
        <li><a href="homepage.html"><i class="fas fa-home"></i><span class="menu-text">Home</span></a></li>
        <li><a href="courses.html"><i class="fas fa-book"></i><span class="menu-text">Courses</span></a></li>
        <li><a href="schedules.html"><i class="fas fa-calendar-alt"></i><span class="menu-text">Schedule</span></a></li>
        <li><a href="grades.html"><i class="fas fa-graduation-cap"></i><span class="menu-text">Grades</span></a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="header-title">Upload and View Grades</div>

    <!-- Batch Selector -->
    <div class="batch-selector">
        <label for="batchSelect">Choose a Batch:</label>
        <select id="batchSelect">
            <option value="batch1">First Year: Computer Science</option>
            <option value="batch2">Second Year: Information Technology</option>
            <option value="batch3">Third Year: Data Science</option>
        </select>
    </div>

    <!-- Upload Grades Form -->
    <div class="upload-form">
        <label for="gradesFile">Upload Grades (PDF Format):</label>
        <input type="file" id="gradesFile" accept=".pdf">
        <button onclick="uploadGrades()">Upload</button>
    </div>

    <!-- Display Grades Table -->
    <table class="grades-table" id="gradesTable">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Course</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <!-- Grades will be dynamically added here -->
        </tbody>
    </table>
</div>

<script>
    const batchSelect = document.getElementById('batchSelect');
    const gradesTable = document.getElementById('gradesTable').getElementsByTagName('tbody')[0];

    const gradesData = {
        batch1: [],
        batch2: [],
        batch3: []
    };

    // Function to update grades based on selected batch
    function updateGrades(batch) {
        gradesTable.innerHTML = ""; // Clear current grades

        gradesData[batch].forEach(grade => {
            const row = gradesTable.insertRow();
            const cell1 = row.insertCell(0);
            const cell2 = row.insertCell(1);
            const cell3 = row.insertCell(2);
            cell1.textContent = grade.student;
            cell2.textContent = grade.course;
            cell3.textContent = grade.grade;
        });
    }

    // Initial load of Batch 1 grades
    updateGrades(batchSelect.value);

    // Update grades when a different batch is selected
    batchSelect.addEventListener('change', (event) => {
        updateGrades(event.target.value);
    });

    // Handle PDF file upload
    function uploadGrades() {
        const fileInput = document.getElementById('gradesFile');
        const file = fileInput.files[0];

        if (!file) {
            alert('Please select a file to upload.');
            return;
        }

        // Validate that the file is a PDF
        if (file.type !== 'application/pdf') {
            alert('Please upload a valid PDF file.');
            return;
        }

        console.log("File selected: ", file.name); // Debugging message

        const reader = new FileReader();
        reader.onload = function(e) {
            const pdfData = new Uint8Array(e.target.result);

            // Use pdf.js to load and extract the content from the PDF
            pdfjsLib.getDocument(pdfData).promise.then(function(pdf) {
                const numPages = pdf.numPages;
                let textContent = '';
                
                // Extract text from each page of the PDF
                let pagePromises = [];
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    pagePromises.push(pdf.getPage(pageNum).then(function(page) {
                        return page.getTextContent().then(function(text) {
                            text.items.forEach(item => {
                                textContent += item.str + ' ';  // Combine all the text content
                            });
                        });
                    }));
                }

                // Once all pages are processed, parse grades
                Promise.all(pagePromises).then(function() {
                    console.log('Extracted text content: ', textContent); // Debugging message
                    parseGrades(textContent);
                }).catch(function(error) {
                    console.error('Error extracting text from PDF:', error);
                    alert('An error occurred while extracting text from the PDF.');
                });
            }).catch(function(error) {
                console.error('Error loading PDF:', error);
                alert('An error occurred while loading the PDF.');
            });
        };
        
        reader.onerror = function(error) {
            console.error('Error reading file:', error);
            alert('An error occurred while reading the file.');
        };
        
        reader.readAsArrayBuffer(file);
    }

    // Parse grades from the extracted text
    function parseGrades(text) {
        const lines = text.split('\n');
        const newGrades = [];

        // Assuming the format: "Student Name | Course | Grade"
        lines.forEach(line => {
            const parts = line.split('|');
            if (parts.length === 3) {
                const student = parts[0].trim();
                const course = parts[1].trim();
                const grade = parts[2].trim();

                if (student && course && grade) {
                    newGrades.push({ student, course, grade });
                }
            }
        });

        // Update the grades data for the selected batch
        gradesData[batchSelect.value] = newGrades;

        // Update the displayed grades
        updateGrades(batchSelect.value);
    }
</script>

</body>
</html>
