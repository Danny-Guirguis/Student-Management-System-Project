<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadat Academy For Management Sciences</title>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
    <script src="./js/register.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
    <link rel="stylesheet" href="./css/register.css">
    <style>
        /* You can keep your CSS here or in the external file */
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">SAMS</div>
        <ul>
            <li><a href="signin.html">Login</a></li>
            <li><a href="index.html">Home</a></li>
        </ul>
    </div>

    <!-- Sign-up Form -->
    <div class="container">
        <img src="./assets/samslogopng.png" alt="Logo" class="logo-img">
        <h2>Create an account</h2>
        <form id="signupForm">
            <select id="userType" required>
                <option value="">Select User Type</option>
                <option value="student">Student</option>
                <option value="doctor">Doctor</option>
                <option value="staff">University Staff</option>
            </select>

            <input type="text" id="fname" placeholder="First Name" required>
            <input type="text" id="lname" placeholder="Last Name" required>

            <div id="facultyWrapper">
                <select id="faculty">
                    <option value="">Select Faculty</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Languages and Translation">Languages and Translation</option>
                    <option value="Management Sciences">Management Sciences</option>
                </select>
            </div>

            <div id="yearWrapper">
                <select id="year">
                    <option value="">Select Year</option>
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>
                </select>
            </div>

            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Create password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit">Sign up</button>
        </form>
        <p>Have an account? <a href="signin.html">Sign in</a></p>
    </div>
</body>
</html>
